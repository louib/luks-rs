[package]
name = "luks"
version = "0.4.3"
edition = "2024"
description = "Pure-Rust Library for the Linux Unified Key Setup"
repository = "https://github.com/louib/luks-rs"
homepage = "https://github.com/louib/luks-rs"
license = "MIT"

readme = "README.md"

include = [
  "src/",
  "examples/",
  "README.md",
  "LICENSE",
]

[features]
_write = []
interactive = ["rpassword"]
_challenge_response = ["dep:challenge_response", "dep:hkdf", "dep:sha1"]

[[bin]]
name = "create_fixture"

[[bin]]
name = "verify_fixture"

[[example]]
name = "verify_passphrase"
required-features = ["interactive"]

[dependencies]
aes = "0.9"
argon2 = "0.5"
base64 = "0.22"
byteorder = "1.5"
hmac = "0.13"
pbkdf2 = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
xts-mode = "0.6"
secrecy = "0.10"
rpassword = { version = "7", optional = true }
rand = "0.10"
challenge_response = { version = "0.5", optional = true, default-features = false, features = ["nusb"] }
hkdf = { version = "0.13", optional = true }
sha1 = { version = "0.11", optional = true }

[dev-dependencies]
